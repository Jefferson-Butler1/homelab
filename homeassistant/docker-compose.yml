services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    networks:
      - ha-net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config:/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8123:8123"
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0  # For future Z-Wave/Zigbee USB devices
      - /dev/ttyUSB1:/dev/ttyUSB1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ha-net:
    driver: bridge